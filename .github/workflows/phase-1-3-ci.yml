name: Phase 1-3 validation

on:
  push:
    branches:
      - feat/zh-cn-dam-browser-capture
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-and-extension:
    name: Frontend and extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src-vite/package-lock.json

      - name: Install frontend dependencies
        working-directory: src-vite
        run: npm ci

      - name: Audit Simplified Chinese localization
        working-directory: src-vite
        run: npm run i18n:audit:strict

      - name: Build frontend
        working-directory: src-vite
        run: npm run build

      - name: Validate extension JavaScript
        run: |
          node --check lap-extension/background.js
          node --check lap-extension/options.js
          if [ -f lap-extension/popup.js ]; then node --check lap-extension/popup.js; fi

      - name: Validate extension manifest
        run: node -e "JSON.parse(require('fs').readFileSync('lap-extension/manifest.json','utf8')); console.log('manifest.json OK')"

  rust-check:
    name: Rust check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libheif-dev libraw-dev \
            ffmpeg clang cmake

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check Rust backend
        working-directory: src-tauri
        run: cargo check --locked
