name: One-shot fix AI raw string

on:
  push:
    branches:
      - feat/phase4-ai-preview-pipeline
    paths:
      - .github/workflows/one-shot-fix-ai-raw-string.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase4-ai-preview-pipeline
          fetch-depth: 0

      - name: Repair Rust raw string delimiter
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/t_ai_online.rs')
          text = path.read_text(encoding='utf-8')
          old = 'const DEFAULT_SYSTEM_PROMPT: &str = r#"'
          new = 'const DEFAULT_SYSTEM_PROMPT: &str = r##"'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected opening delimiter count: {text.count(old)}')
          text = text.replace(old, new, 1)
          old_end = '}。"#;'
          new_end = '}。"##;'
          if text.count(old_end) != 1:
              raise SystemExit(f'unexpected closing delimiter count: {text.count(old_end)}')
          text = text.replace(old_end, new_end, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- src-tauri/src/t_ai_online.rs

      - name: Commit repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/t_ai_online.rs
          git commit -m "fix(ai): use collision-safe raw string delimiter"
          git push origin HEAD:feat/phase4-ai-preview-pipeline
