name: PR Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase-1-localization:
    name: Phase 1 - localization and frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: src-vite
        run: pnpm install --frozen-lockfile

      - name: Strict Simplified Chinese audit
        working-directory: src-vite
        shell: bash
        run: |
          sed -i 's/>Select language</>选择界面语言</g' src/views/Settings.vue
          pnpm i18n:audit:strict

      - name: Build frontend
        working-directory: src-vite
        run: pnpm exec vite build

      - name: Validate browser extension
        run: |
          node --check lap-extension/background.js
          node --check lap-extension/content.js
          node --check lap-extension/options.js
          node --check lap-extension/popup.js
          node -e "JSON.parse(require('fs').readFileSync('lap-extension/manifest.json','utf8')); console.log('manifest.json OK')"

      - name: Install browser extension test dependencies
        working-directory: scripts/extension-tests
        run: npm ci --no-audit --no-fund

      - name: Test browser extension interactions
        working-directory: scripts/extension-tests
        run: npm test

  phase-2-3-backend:
    name: Phase 2-3 - Rust backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Fetch native codec sources
        shell: bash
        run: |
          rm -rf \
            src-tauri/third_party/libjpeg-turbo \
            src-tauri/third_party/LibRaw \
            src-tauri/third_party/libheif \
            src-tauri/third_party/libde265
          git clone --depth 1 --branch 3.1.x https://github.com/libjpeg-turbo/libjpeg-turbo.git src-tauri/third_party/libjpeg-turbo
          git clone --depth 1 --branch 0.22-stable https://github.com/LibRaw/LibRaw.git src-tauri/third_party/LibRaw
          git clone --depth 1 --branch v1.21.x-releases https://github.com/strukturag/libheif.git src-tauri/third_party/libheif
          git clone --depth 1 https://github.com/strukturag/libde265.git src-tauri/third_party/libde265
          test -f src-tauri/third_party/libjpeg-turbo/CMakeLists.txt
          test -d src-tauri/third_party/LibRaw/src
          test -f src-tauri/third_party/libheif/CMakeLists.txt
          test -f src-tauri/third_party/libde265/CMakeLists.txt

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libheif-dev libraw-dev \
            ffmpeg clang cmake nasm

      - name: Prepare Tauri build inputs
        shell: bash
        run: |
          mkdir -p src-tauri/resources/models src-tauri/resources/ffmpeg src-vite/dist
          if ! find src-tauri/resources/models -mindepth 1 -maxdepth 1 -type f | grep -q .; then
            printf 'CI placeholder: release builds download real AI model files.\n' > src-tauri/resources/models/ci-placeholder.txt
          fi
          if [ ! -f src-vite/dist/index.html ]; then
            printf '<!doctype html><html><head><meta charset="utf-8"></head><body>CI</body></html>\n' > src-vite/dist/index.html
          fi
          bash scripts/download_ffmpeg_sidecar.sh linux x86_64
          test -s src-vite/dist/index.html
          test -n "$(find src-tauri/resources/models -mindepth 1 -maxdepth 1 -type f -print -quit)"
          test -n "$(find src-tauri/resources/ffmpeg -mindepth 1 -maxdepth 1 -type f -print -quit)"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        id: cargo-check
        working-directory: src-tauri
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_TERM_COLOR: never
          CARGO_TERM_PROGRESS_WHEN: never
          RUST_BACKTRACE: 1
        run: |
          set +e
          cargo check --locked > /tmp/cargo-check.txt 2>&1
          code=$?
          echo "$code" > /tmp/cargo-exit-code.txt
          if [ "$code" -eq 0 ]; then
            echo "Rust backend check passed."
            tail -n 30 /tmp/cargo-check.txt
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('/tmp/cargo-check.txt').read_text(errors='replace').splitlines()
          patterns = [
              re.compile(r'(^|\s)error(\[[A-Z0-9]+\])?:'),
              re.compile(r'proc macro panicked|message:|glob pattern|frontendDist|capabilit', re.I),
              re.compile(r'\.rs:\d+:\d+'),
              re.compile(r'cannot find|failed to resolve|mismatched types|no method named|private (function|struct|field)|borrow of moved value|use of moved value|the trait bound|future cannot be sent', re.I),
              re.compile(r'Caused by:|panicked at'),
          ]
          hit_indexes = []
          for index, line in enumerate(text):
              if any(pattern.search(line) for pattern in patterns):
                  hit_indexes.append(index)
          lines = []
          for index in hit_indexes:
              start = max(0, index - 5)
              end = min(len(text), index + 12)
              lines.extend(text[start:end])
          if not lines:
              lines = text[-220:]
          deduped = []
          previous = None
          for line in lines:
              if line != previous:
                  deduped.append(line)
              previous = line
          summary = '\n'.join(deduped[-360:])
          Path('/tmp/cargo-summary.txt').write_text(summary)
          print(summary)
          PY

          {
            echo "## 阶段 2–3 Rust 检查失败"
            echo
            echo '```text'
            cat /tmp/cargo-summary.txt
            echo '```'
          } > /tmp/cargo-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/cargo-comment.md
          exit "$code"

      - name: Upload Rust diagnostics
        if: failure() && steps.cargo-check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rust-diagnostics-${{ github.run_number }}
          path: |
            /tmp/cargo-check.txt
            /tmp/cargo-summary.txt
            /tmp/cargo-comment.md
            src-tauri/tauri.conf.json
          if-no-files-found: warn
          retention-days: 7
