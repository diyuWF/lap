name: PR Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase-1-localization:
    name: Phase 1 - localization and frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: src-vite
        run: pnpm install --frozen-lockfile

      - name: Strict Simplified Chinese audit
        working-directory: src-vite
        run: pnpm i18n:audit:strict

      - name: Build frontend
        working-directory: src-vite
        run: pnpm exec vite build

      - name: Validate browser extension
        run: |
          node --check lap-extension/background.js
          node --check lap-extension/options.js
          node --check lap-extension/popup.js
          node -e "JSON.parse(require('fs').readFileSync('lap-extension/manifest.json','utf8')); console.log('manifest.json OK')"

  phase-2-3-backend:
    name: Phase 2-3 - Rust backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libheif-dev libraw-dev \
            ffmpeg clang cmake

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked
