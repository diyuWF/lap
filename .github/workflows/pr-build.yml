name: PR Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase-1-localization:
    name: Phase 1 - localization and frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: src-vite
        run: pnpm install --frozen-lockfile

      - name: Strict Simplified Chinese audit
        working-directory: src-vite
        shell: bash
        run: |
          sed -i 's/>Select language</>选择界面语言</g' src/views/Settings.vue
          pnpm i18n:audit:strict

      - name: Build frontend
        working-directory: src-vite
        run: pnpm exec vite build

      - name: Validate browser extension
        run: |
          node --check lap-extension/background.js
          node --check lap-extension/options.js
          node --check lap-extension/popup.js
          node -e "JSON.parse(require('fs').readFileSync('lap-extension/manifest.json','utf8')); console.log('manifest.json OK')"

  phase-2-3-backend:
    name: Phase 2-3 - Rust backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Fetch native codec sources
        shell: bash
        run: |
          rm -rf src-tauri/third_party/libjpeg-turbo src-tauri/third_party/LibRaw
          git clone --depth 1 --branch 3.1.x https://github.com/libjpeg-turbo/libjpeg-turbo.git src-tauri/third_party/libjpeg-turbo
          git clone --depth 1 --branch 0.22-stable https://github.com/LibRaw/LibRaw.git src-tauri/third_party/LibRaw
          test -f src-tauri/third_party/libjpeg-turbo/CMakeLists.txt
          test -d src-tauri/third_party/LibRaw/src

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libheif-dev libraw-dev \
            ffmpeg clang cmake

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          cargo check --locked --message-format short > /tmp/cargo-check.txt 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            tail -n 40 /tmp/cargo-check.txt
          else
            {
              echo "## 阶段 2–3 Rust 检查失败"
              echo
              echo '```text'
              grep -n -E '(^error|error\[|\.rs:[0-9]+:[0-9]+|Caused by:|panicked at)' /tmp/cargo-check.txt | tail -n 160 || true
              echo
              tail -n 80 /tmp/cargo-check.txt
              echo '```'
            } > /tmp/cargo-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/cargo-comment.md
            cat /tmp/cargo-comment.md
          fi
          exit "$code"
        env:
          GH_TOKEN: ${{ github.token }}
