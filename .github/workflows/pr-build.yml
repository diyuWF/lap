name: PR Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase-1-localization:
    name: Phase 1 - localization and frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: src-vite
        run: pnpm install --frozen-lockfile

      - name: Strict Simplified Chinese audit
        id: localization
        working-directory: src-vite
        shell: bash
        run: |
          set +e
          sed -i 's/>Select language</>选择界面语言</g' src/views/Settings.vue
          pnpm i18n:audit:strict > /tmp/localization.txt 2>&1
          code=$?
          tail -n 160 /tmp/localization.txt
          if [ "$code" -ne 0 ]; then
            {
              echo "## 阶段 1 汉化审计失败"
              echo
              echo '```text'
              tail -n 120 /tmp/localization.txt
              echo '```'
            } > /tmp/localization-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/localization-comment.md
          fi
          exit "$code"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build frontend
        working-directory: src-vite
        run: pnpm exec vite build

      - name: Validate browser extension
        run: |
          node --check lap-extension/background.js
          node --check lap-extension/options.js
          node --check lap-extension/popup.js
          node -e "JSON.parse(require('fs').readFileSync('lap-extension/manifest.json','utf8')); console.log('manifest.json OK')"

  phase-2-3-backend:
    name: Phase 2-3 - Rust backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          submodules: false

      - name: Initialize native codec sources
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --remote --depth 1
          test -f src-tauri/third_party/libjpeg-turbo/CMakeLists.txt
          test -d src-tauri/third_party/LibRaw/src

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libheif-dev libraw-dev \
            ffmpeg clang cmake

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          cargo check --locked --message-format short > /tmp/cargo-check.txt 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            tail -n 40 /tmp/cargo-check.txt
          else
            echo "::group::Rust compiler errors"
            grep -n -E '(^error|error\[|\.rs:[0-9]+:[0-9]+|Caused by:|panicked at)' /tmp/cargo-check.txt | tail -n 220 || true
            echo "::endgroup::"
            echo "::group::Final compiler context"
            tail -n 180 /tmp/cargo-check.txt
            echo "::endgroup::"
            {
              echo "## 阶段 2–3 Rust 检查失败"
              echo
              echo '```text'
              grep -n -E '(^error|error\[|\.rs:[0-9]+:[0-9]+|Caused by:|panicked at)' /tmp/cargo-check.txt | tail -n 160 || true
              echo
              tail -n 80 /tmp/cargo-check.txt
              echo '```'
            } > /tmp/cargo-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/cargo-comment.md
          fi
          exit "$code"
        env:
          GH_TOKEN: ${{ github.token }}
