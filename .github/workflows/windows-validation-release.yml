name: Windows Validation Release

on:
  push:
    branches:
      - feat/phase4-ai-preview-pipeline
    paths:
      - .github/workflows/windows-validation-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows:
    name: Build Windows x64 validation installer
    runs-on: windows-2022
    timeout-minutes: 150

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: feat/phase4-ai-preview-pipeline
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pnpm\store
          key: windows-pnpm-${{ hashFiles('src-vite/pnpm-lock.yaml') }}
          restore-keys: windows-pnpm-

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            src-tauri\target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/build.rs') }}
          restore-keys: windows-cargo-

      - name: Install native build tools
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          $chocolateyBin = Join-Path $env:ChocolateyInstall 'bin'
          $nasmTools = Join-Path $env:ChocolateyInstall 'lib\nasm\tools'
          $paths = @($chocolateyBin, $nasmTools) | Where-Object { Test-Path $_ }
          foreach ($path in $paths) {
            $path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          $env:Path = (($paths + $env:Path) -join ';')
          $nasm = Get-Command nasm.exe -ErrorAction Stop
          Write-Host "Using NASM at $($nasm.Source)"
          & $nasm.Source -v
          cmake --version

      - name: Install frontend dependencies
        working-directory: src-vite
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Download bundled AI models
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: .\scripts\download_models.ps1

      - name: Download Windows FFmpeg sidecars
        shell: pwsh
        run: .\scripts\download_ffmpeg_sidecar.ps1 -Arch x64

      - name: Disable updater signing for unsigned validation build
        shell: pwsh
        run: |
          $path = 'src-tauri\tauri.conf.json'
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config.bundle.targets = @('nsis')
          $config | ConvertTo-Json -Depth 100 | Set-Content $path -Encoding utf8

      - name: Validate browser extension and removed right-click code
        shell: pwsh
        run: |
          node --check lap-extension\background.js
          node --check lap-extension\content.js
          node --check lap-extension\options.js
          node --check lap-extension\popup.js
          node -e "JSON.parse(require('fs').readFileSync('lap-extension/manifest.json','utf8')); console.log('manifest.json OK')"
          $matches = Get-ChildItem lap-extension -Recurse -File | Select-String -Pattern 'contextMenus'
          if ($matches) {
            $matches | ForEach-Object { Write-Error $_.ToString() }
            throw '发现 Chrome 右键菜单残留。'
          }

      - name: Strict Simplified Chinese audit
        working-directory: src-vite
        shell: pwsh
        run: pnpm i18n:audit:strict

      - name: Build frontend
        working-directory: src-vite
        shell: pwsh
        run: pnpm exec vite build

      - name: Cargo check locked dependencies
        working-directory: src-tauri
        shell: pwsh
        run: cargo check --locked

      - name: Build unsigned NSIS installer
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
        with:
          projectPath: .
          args: --verbose --target x86_64-pc-windows-msvc --bundles nsis

      - name: Collect validation package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $installers = Get-ChildItem 'src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\*.exe' -ErrorAction SilentlyContinue
          if (-not $installers) {
            $installers = Get-ChildItem 'src-tauri\target\release\bundle\nsis\*.exe' -ErrorAction SilentlyContinue
          }
          if (-not $installers) {
            throw '未找到 NSIS 安装程序。'
          }
          $installers | Copy-Item -Destination release-assets
          Compress-Archive -Path 'lap-extension\*' -DestinationPath 'release-assets\Lap-Browser-Extension-0.4.0.zip' -Force
          Get-ChildItem release-assets -File | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "{0}  {1}" -f $hash.Hash.ToLowerInvariant(), $_.Name
          } | Set-Content 'release-assets\SHA256SUMS.txt' -Encoding ascii
          Get-ChildItem release-assets -File | Format-Table Name, Length

      - name: Upload Windows validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lap-Windows-Validation-${{ github.run_number }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish-prerelease:
    name: Publish GitHub prerelease
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download validation artifact
        uses: actions/download-artifact@v4
        with:
          name: Lap-Windows-Validation-${{ github.run_number }}
          path: release-assets

      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.3.0-rc.${GITHUB_RUN_NUMBER}"
          notes=$(cat <<'EOF'
          Windows 人工验证版本，来自 `feat/phase4-ai-preview-pipeline`。

          包含：
          - Lap Windows x64 NSIS 安装程序（未进行商业代码签名）
          - Lap 浏览器采集扩展 ZIP
          - SHA-256 校验文件

          验证重点：
          - Windows 安装、启动、素材库创建与既有库升级
          - SVG、PDF、GLB/glTF、OBJ、STL 预览
          - 浏览器拖拽采集与工具栏批量采集
          - 在线 AI Provider、单文件分析、批量整理与建议审核

          未签名验证版可能触发 Windows SmartScreen。请核对 SHA256SUMS.txt，并只在测试环境安装。
          EOF
          )
          gh release create "$tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Lap Windows Validation RC ${GITHUB_RUN_NUMBER}" \
            --notes "$notes" \
            --prerelease
