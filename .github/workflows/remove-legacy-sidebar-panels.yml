name: Remove legacy sidebar panels

on:
  push:
    branches:
      - feat/phase4-ai-preview-pipeline
    paths:
      - .github/workflows/remove-legacy-sidebar-panels.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-panels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase4-ai-preview-pipeline
          fetch-depth: 0

      - name: Remove sidebar entries and unused panels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src-vite/src/views/Home.vue')
          text = path.read_text(encoding='utf-8')

          exact_lines = [
              "import Library from '@/components/Library.vue';\n",
              "import Location from '@/components/Location.vue';\n",
              "import Camera from '@/components/Camera.vue';\n",
              "  IconLocation,\n",
              "  IconCamera,\n",
              "  IconStack,\n",
              "  { index: SIDEBAR.LIBRARY, icon: IconStack, component: Library, text: localeMsg.value.sidebar.library },\n",
              "  { index: SIDEBAR.LOCATION, icon: IconLocation, component: Location, text: localeMsg.value.sidebar.location },\n",
              "  { index: SIDEBAR.CAMERA, icon: IconCamera, component: Camera, text: localeMsg.value.sidebar.camera },\n",
          ]
          for line in exact_lines:
              count = text.count(line)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence, found {count}: {line!r}')
              text = text.replace(line, '', 1)

          old_active = """const activeSidebarButton = computed(() =>
  buttons.value.find(item => item.index === config.main.sidebarIndex) || buttons.value[SIDEBAR.LIBRARY]
);
"""
          new_active = """const removedSidebarIndices = new Set<number>([
  SIDEBAR.LIBRARY,
  SIDEBAR.LOCATION,
  SIDEBAR.CAMERA,
]);

const activeSidebarButton = computed(() =>
  buttons.value.find(item => item.index === config.main.sidebarIndex)
  || buttons.value.find(item => item.index === SIDEBAR.ALBUM)
  || buttons.value[0]
);
"""
          if text.count(old_active) != 1:
              raise SystemExit('activeSidebarButton block changed unexpectedly')
          text = text.replace(old_active, new_active, 1)

          old_visible = """const visibleButtons = computed(() =>
  buttons.value
    .map((item) => ({ ...item, disabled: libraryEmpty.value && item.index !== SIDEBAR.ALBUM }))
    .filter(item => !item.hidden)
    .sort((a, b) => a.index - b.index)
);
"""
          new_visible = old_visible + """
watch(
  () => config.main.sidebarIndex,
  (index) => {
    if (removedSidebarIndices.has(index)) {
      config.main.sidebarIndex = SIDEBAR.ALBUM;
    }
  },
  { immediate: true },
);
"""
          if text.count(old_visible) != 1:
              raise SystemExit('visibleButtons block changed unexpectedly')
          text = text.replace(old_visible, new_visible, 1)
          path.write_text(text, encoding='utf-8')

          source_root = Path('src-vite/src')
          candidates = [
              source_root / 'components/Library.vue',
              source_root / 'components/Location.vue',
              source_root / 'components/Camera.vue',
          ]
          source_files = [
              item for item in source_root.rglob('*')
              if item.is_file() and item.suffix in {'.vue', '.js', '.ts', '.tsx', '.jsx'}
          ]
          for candidate in candidates:
              stem = candidate.stem
              patterns = (
                  f'@/components/{stem}.vue',
                  f'@/components/{stem}',
                  f'./{stem}.vue',
                  f'../components/{stem}.vue',
              )
              references = []
              for item in source_files:
                  if item == candidate:
                      continue
                  content = item.read_text(encoding='utf-8', errors='ignore')
                  if any(pattern in content for pattern in patterns):
                      references.append(str(item))
              if not references and candidate.exists():
                  candidate.unlink()
                  print(f'Removed {candidate}')
              elif references:
                  print(f'Keeping {candidate}; referenced by {references}')

          home = path.read_text(encoding='utf-8')
          forbidden = [
              "component: Library",
              "component: Location",
              "component: Camera",
              "@/components/Library.vue",
              "@/components/Location.vue",
              "@/components/Camera.vue",
          ]
          leftovers = [value for value in forbidden if value in home]
          if leftovers:
              raise SystemExit(f'Legacy sidebar references remain: {leftovers}')
          PY
          git diff --check

      - name: Commit sidebar cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-vite/src/views/Home.vue src-vite/src/components
          git commit -m "refactor(ui): remove asset location and camera sidebar panels"
          git push origin HEAD:feat/phase4-ai-preview-pipeline
