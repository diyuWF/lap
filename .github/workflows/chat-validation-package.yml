name: Chat Validation Package

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows-package:
    name: Build verified Windows and browser package
    runs-on: windows-2022
    timeout-minutes: 150

    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install pinned NASM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '3.02'
          $zip = Join-Path $env:RUNNER_TEMP "nasm-$version-win64.zip"
          $root = Join-Path $env:RUNNER_TEMP 'nasm'
          $url = "https://www.nasm.us/pub/nasm/releasebuilds/$version/win64/nasm-$version-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $root -Force
          $nasm = Get-ChildItem $root -Recurse -Filter nasm.exe | Select-Object -First 1
          if (-not $nasm) { throw 'NASM executable not found.' }
          $nasm.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$($nasm.DirectoryName);$env:Path"
          & $nasm.FullName -v

      - name: Configure validation versions and unsigned NSIS bundle
        shell: pwsh
        run: |
          $tauriPath = 'src-tauri\tauri.conf.json'
          $tauri = Get-Content $tauriPath -Raw | ConvertFrom-Json
          $tauri.version = '0.4.1'
          $tauri.bundle.createUpdaterArtifacts = $false
          $tauri.bundle.targets = @('nsis')
          $tauri | ConvertTo-Json -Depth 100 | Set-Content $tauriPath -Encoding utf8

          $manifestPath = 'lap-extension\manifest.json'
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest.version = '0.4.1'
          $manifest | ConvertTo-Json -Depth 100 | Set-Content $manifestPath -Encoding utf8

      - name: Validate all browser extension resources
        shell: pwsh
        run: |
          $validator = @'
          const fs = require('fs');
          const path = require('path');
          const root = 'lap-extension';
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'manifest.json'), 'utf8'));
          const refs = new Set();
          if (manifest.background?.service_worker) refs.add(manifest.background.service_worker);
          for (const entry of manifest.content_scripts || []) {
            for (const file of entry.js || []) refs.add(file);
            for (const file of entry.css || []) refs.add(file);
          }
          if (manifest.action?.default_popup) refs.add(manifest.action.default_popup);
          if (manifest.options_page) refs.add(manifest.options_page);
          if (manifest.options_ui?.page) refs.add(manifest.options_ui.page);
          for (const iconMap of [manifest.icons, manifest.action?.default_icon]) {
            if (iconMap && typeof iconMap === 'object') {
              for (const file of Object.values(iconMap)) refs.add(file);
            }
          }
          const missing = [...refs].filter(file => !fs.existsSync(path.join(root, file)));
          if (missing.length) throw new Error(`Manifest resources missing: ${missing.join(', ')}`);
          console.log(`Validated ${refs.size} manifest resources: ${[...refs].join(', ')}`);
          '@
          Set-Content -Path "$env:RUNNER_TEMP\validate-extension.js" -Value $validator -Encoding utf8
          node "$env:RUNNER_TEMP\validate-extension.js"
          Get-ChildItem lap-extension -Filter *.js | ForEach-Object { node --check $_.FullName }

      - name: Install frontend dependencies
        working-directory: src-vite
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Download bundled AI models
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: .\scripts\download_models.ps1

      - name: Download Windows FFmpeg sidecars
        shell: pwsh
        run: .\scripts\download_ffmpeg_sidecar.ps1 -Arch x64

      - name: Strict Simplified Chinese audit
        working-directory: src-vite
        shell: pwsh
        run: pnpm i18n:audit:strict

      - name: Build frontend
        working-directory: src-vite
        shell: pwsh
        run: pnpm exec vite build

      - name: Cargo check locked dependencies
        working-directory: src-tauri
        shell: pwsh
        run: cargo check --locked

      - name: Build unsigned NSIS installer
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
        with:
          projectPath: .
          args: --verbose --target x86_64-pc-windows-msvc --bundles nsis

      - name: Assemble chat delivery package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path chat-delivery -Force | Out-Null
          $installers = Get-ChildItem 'src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\*.exe' -ErrorAction SilentlyContinue
          if (-not $installers) {
            $installers = Get-ChildItem 'src-tauri\target\release\bundle\nsis\*.exe' -ErrorAction SilentlyContinue
          }
          if (-not $installers) { throw 'NSIS installer not found.' }
          Copy-Item $installers[0].FullName 'chat-delivery\Lap-0.4.1-chat-validation-x64-setup.exe'
          Compress-Archive -Path 'lap-extension\*' -DestinationPath 'chat-delivery\Lap-Browser-Extension-0.4.1.zip' -Force
          Get-ChildItem chat-delivery -File | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "{0}  {1}" -f $hash.Hash.ToLowerInvariant(), $_.Name
          } | Set-Content 'chat-delivery\SHA256SUMS.txt' -Encoding ascii
          Get-ChildItem chat-delivery -File | Format-Table Name, Length

      - name: Upload package for chat delivery
        uses: actions/upload-artifact@v4
        with:
          name: Lap-0.4.1-Chat-Delivery-${{ github.run_number }}
          path: chat-delivery/*
          if-no-files-found: error
          retention-days: 30
