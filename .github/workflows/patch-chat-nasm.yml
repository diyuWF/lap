name: Patch chat NASM install

on:
  push:
    branches:
      - feat/phase4-ai-preview-pipeline
    paths:
      - .github/workflows/patch-chat-nasm.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase4-ai-preview-pipeline
          fetch-depth: 0

      - name: Add retry and Chocolatey fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/chat-validation-package.yml')
          text = path.read_text(encoding='utf-8')
          old = '''      - name: Install pinned NASM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '3.02'
          $zip = Join-Path $env:RUNNER_TEMP "nasm-$version-win64.zip"
          $root = Join-Path $env:RUNNER_TEMP 'nasm'
          $url = "https://www.nasm.us/pub/nasm/releasebuilds/$version/win64/nasm-$version-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $root -Force
          $nasm = Get-ChildItem $root -Recurse -Filter nasm.exe | Select-Object -First 1
          if (-not $nasm) { throw 'NASM executable not found.' }
          $nasm.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$($nasm.DirectoryName);$env:Path"
          & $nasm.FullName -v
'''
          new = '''      - name: Install NASM with retry and fallback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nasmPath = $null
          $existing = Get-Command nasm.exe -ErrorAction SilentlyContinue
          if ($existing) {
            $nasmPath = $existing.Source
            Write-Host "Using preinstalled NASM at $nasmPath"
          }

          if (-not $nasmPath) {
            $version = '3.02'
            $zip = Join-Path $env:RUNNER_TEMP "nasm-$version-win64.zip"
            $root = Join-Path $env:RUNNER_TEMP 'nasm'
            $url = "https://www.nasm.us/pub/nasm/releasebuilds/$version/win64/nasm-$version-win64.zip"
            $downloaded = $false

            for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                Write-Host "Downloading NASM from official source, attempt $attempt of 5"
                Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 90
                $downloaded = $true
                break
              } catch {
                Write-Warning "Official NASM download failed: $($_.Exception.Message)"
                if ($attempt -lt 5) {
                  Start-Sleep -Seconds ([Math]::Pow(2, $attempt))
                }
              }
            }

            if ($downloaded) {
              if (Test-Path $root) { Remove-Item $root -Recurse -Force }
              Expand-Archive -Path $zip -DestinationPath $root -Force
              $downloadedNasm = Get-ChildItem $root -Recurse -Filter nasm.exe | Select-Object -First 1
              if ($downloadedNasm) {
                $nasmPath = $downloadedNasm.FullName
              }
            }
          }

          if (-not $nasmPath) {
            Write-Warning 'Official NASM download was unavailable; falling back to Chocolatey.'
            $choco = Get-Command choco.exe -ErrorAction SilentlyContinue
            if (-not $choco) { throw 'Chocolatey is unavailable on this Windows runner.' }

            $installed = $false
            foreach ($package in @('nasm', 'nasm.portable')) {
              & $choco.Source install $package -y --no-progress --limit-output
              if ($LASTEXITCODE -in @(0, 1641, 3010)) {
                $installed = $true
                break
              }
              Write-Warning "Chocolatey package $package failed with exit code $LASTEXITCODE"
            }
            if (-not $installed) { throw 'Unable to install NASM from Chocolatey.' }

            $chocoRoot = if ($env:ChocolateyInstall) { $env:ChocolateyInstall } else { 'C:\ProgramData\chocolatey' }
            $installedNasm = Get-ChildItem $chocoRoot -Recurse -Filter nasm.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($installedNasm) {
              $nasmPath = $installedNasm.FullName
            }
          }

          if (-not $nasmPath -or -not (Test-Path $nasmPath)) {
            throw 'NASM executable not found after all installation methods.'
          }

          $nasmDir = Split-Path -Parent $nasmPath
          $nasmDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$nasmDir;$env:Path"
          & $nasmPath -v
'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one NASM block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm .github/workflows/patch-chat-nasm.yml
          git diff --check

      - name: Commit workflow repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/chat-validation-package.yml .github/workflows/patch-chat-nasm.yml
          git commit -m "ci: retry NASM download with Chocolatey fallback"
          git push origin HEAD:feat/phase4-ai-preview-pipeline
